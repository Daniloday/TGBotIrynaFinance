[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgbot-iryna-finance"
version = "0.1.0"
description = "Telegram group expense splitter bot built with aiogram."
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.28.2",
    "python-dotenv==1.2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
